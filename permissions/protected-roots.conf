# Paths agents must never delete, move or truncate.
#
# Read by permissions/bin/protected-paths-hook, a PreToolUse hook on Bash. The
# hook resolves a command's actual targets — following `cd`, `&&` and `;` —
# before matching, which is the thing static permission rules cannot do:
# `Bash(rm -rf /Users/.../trash)` can be denied while
# `cd /Users/... && rm -rf trash` sails past, because the rules match text and
# not paths.
#
# One entry per line. Blank lines and # comments are ignored.
#
#   /absolute/path      protects that path, everything under it, AND every
#                       parent of it — deleting a parent destroys it just as
#                       surely as deleting it directly.
#   pattern with * or ? matched with fnmatch against both the full resolved
#                       path and the basename.
#   ~/path              the same, under the home of whoever runs the hook.
#
# A machine whose state lives somewhere else lists those paths in
# protected-roots.local.conf beside this file. It is git-ignored, read after
# this one, and can only add protection.
#
# This is a guardrail against a mistake, not a sandbox: hooks can be disabled
# per-run and are skipped in --bare mode. The static deny rules in
# interactive-baseline.json stay in place underneath it for that reason.

# ---------------------------------------------------------------- pipeline
# The only record of every routine run, and the input to every cost and
# funnel analysis. Kept indefinitely by decision (2026-09-01): logs are how
# progress is tracked, and clearing them happens only in a human-led flow
# after they have been processed. 580 files, one copy each.
~/.agentic-skills/routines/logs

# Per-run cost telemetry. The spend ledger is append-only and has no backup;
# losing it loses the baseline every routing decision is measured against.
~/.agentic-skills/routines/metrics

# The recovery net for agent-cleanup. Everything that makes a staged deletion
# "reversible for 30 days" lives here, so if this goes the reversibility claim
# goes with it — including files staged out of removed worktrees that exist
# nowhere else.
~/.agentic-skills/routines/trash

# Routine ownership. Without it every machine believes it owns every routine,
# and two dispatchers on the same approved issue produce duplicate PRs on
# identically-named branches — the one failure that corrupts state rather
# than wasting a night.
~/.agentic-skills/routines/.pipeline-host

# The prompts the scheduled routines run from. Not regenerable from the repo
# alone once edited in place.
~/.agentic-skills/routines/_archive

# ----------------------------------------------------------------- claude
# Permission policy itself, and the timestamped backups that are the only undo
# path for a bad merge.
~/.claude/settings.json
~/.claude/settings.json.bak-*

# Session transcripts. The 201 files here are the sole source for historical
# cost reconstruction; the API does not serve them again.
~/.claude/projects

# Durable agent memory.
~/.claude/projects/*/memory

# ------------------------------------------------------------- everywhere
# Credentials and databases, wherever they are. A removed git worktree that
# looked clean under `git status --untracked-files=all` still held a live
# server/.env, because gitignored files are invisible to that check.
*.env
*.env.*
.env
.env.*
*.db
*.sqlite
*.sqlite3
*.dump
*.pem
*.key
id_rsa
id_ed25519
