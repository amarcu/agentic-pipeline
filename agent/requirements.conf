# Host tooling this project needs before agent work starts.
#
# Read by launchd-runtime/bin/check-requirements (`make doctor`), and by
# work-on-task Step 1, which refuses the issue rather than spending a worker on
# a host that cannot finish it. One requirement per line; a `#` preceded by a
# space starts the annotation section on any line.
#
#   gate: required | advisory   optional, first directive only. `advisory`
#                               means an ABSENT requirement downgrades this
#                               repo's verify gate to `NO GATE — verify by
#                               reading` instead of blocking the work. It does
#                               NOT cover a `cmd` that is installed but below
#                               its `>=` floor: the tool is there and this file
#                               has declared its output untrustworthy, so that
#                               fails the check whatever the gate says.
#                               Default: required.
#   cmd  <name> [>=<version>]   executable on the routines' PATH. `>=` is the only
#                               operator there is; `<`, `==`, `=>`, a bare version or
#                               anything trailing the version is a parse error, never a
#                               guess at what was meant
#   path <path> [# note]        file or directory, relative to the repo root
#   env  <VAR>                  environment variable, set and non-empty
#   check <shell command>       must exit 0; read-only, never mutating
#
# Annotations: `# hint: <how to get it>` is printed when the requirement fails,
# `# install: <command>` is what install-requirements offers to run.
#
# Versions are read from the first version-like token of `<name> --version`
# ("gh version 2.92.0 (2026-04-28)" -> 2.92.0) and compared component by
# component, with a release ranking above its own pre-releases. A version the
# TOOL reports that cannot be parsed is a WARNING, not a failure: the tool is
# installed, only its self-report is unreadable, and failing there would block
# work over a vendor's formatting change.
#
# A line THIS FILE gets wrong is the opposite — an unknown verb, a verb with no
# argument, a `>=` minimum nothing can be compared against, an unknown or
# misplaced `gate:` — and fails the whole check, exit 1, before anything is
# probed. A requirement with a typo is a requirement silently not being
# checked, and reporting `ok` over one is the failure this file exists to
# prevent. `gate: advisory` does not soften it.

# 2.92 is not cosmetic: pr-review-bundle reads `closingIssuesReferences` off
# `gh pr view`, and the gh 2.63.2 (Dec 2024) on one host does not serve that
# field — every bundle it built carried a placeholder where the acceptance
# criteria should have been.
cmd gh >=2.92    # hint: brew upgrade gh (needs >=2.92 for closingIssuesReferences) # install: brew upgrade gh
cmd jq           # hint: brew install jq — the test helpers abort with exit 5 without it # install: brew install jq
# 3.9 is the floor because it is the ceiling: /usr/bin/python3 on the pipeline
# host is 3.9.6, so every script has to run there. The floor is declared so a
# host BELOW it says so, and so nobody reads a newer workstation interpreter as
# permission to use it — a 3.11 that quietly accepts what 3.9 rejects hides the
# breakage until 04:00 on the one machine that matters.
cmd python3 >=3.9  # hint: /usr/bin/python3 ships with macOS; a broken Xcode CLT selection can hide it

# Every routine that touches GitHub dies without this, and an expired token
# looks exactly like a repo permissions problem from inside a worker.
check gh auth status   # hint: gh auth login
